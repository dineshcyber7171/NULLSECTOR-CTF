<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ACCESS GRANTED</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#000;
color:#00ff88;
font-family:Consolas,monospace;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle,#00ff8840 1px,transparent 1px);
background-size:30px 30px;
animation:grid 15s linear infinite;
opacity:.25;
}

@keyframes grid{
from{transform:translateY(0);}
to{transform:translateY(-30px);}
}

.box{

width:850px;
padding:50px;
text-align:center;
border:2px solid #00ff88;
border-radius:12px;
background:#111;
box-shadow:
0 0 20px #00ff88,
0 0 60px #00ff88;

}

h1{

font-size:70px;
color:#00ffff;
text-shadow:
0 0 20px cyan,
0 0 50px cyan;

margin-bottom:20px;

}

h2{

color:#00ff88;
margin-bottom:25px;

}

p{

font-size:22px;
margin:12px;

}

button{

margin-top:30px;
padding:15px 40px;
font-size:20px;
background:#00ff88;
border:none;
cursor:pointer;
border-radius:8px;
font-weight:bold;

}

button:hover{

background:#00ffff;

}

</style>

</head>

<body>

<div class="box">

<h1>ACCESS GRANTED</h1>

<h2>MISSION COMPLETED</h2>

<p>Congratulations Agent!</p>

<p>You recovered all 3 NULLSECTOR flags.</p>

<p>System Status : <span style="color:lime;">SECURE</span></p>

<p>Final Score : <span style="color:yellow;">300 / 300</span></p>

<p>Designed by <b>Dinesh Shinde</b></p>

<button onclick="window.location.href='index.html'">
Play Again
</button>

</div>

</body>
</html>
