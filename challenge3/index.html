<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<title>NULLSECTOR | Challenge 3</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:#050505;
font-family:Consolas,monospace;
color:#00ff88;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
overflow:hidden;
}

body::before{
content:"";
position:fixed;
width:100%;
height:100%;
background:
radial-gradient(circle,#00ff8840 1px,transparent 1px);
background-size:40px 40px;
opacity:.2;
animation:move 15s linear infinite;
}

@keyframes move{
from{transform:translateY(0);}
to{transform:translateY(-40px);}
}

.terminal{

width:900px;
background:#111;
border:2px solid #00ff88;
border-radius:12px;
padding:35px;
box-shadow:0 0 20px #00ff88,
0 0 50px #00ff88;
position:relative;
z-index:2;

}

.header{

text-align:center;
margin-bottom:30px;

}

.header h1{

font-size:48px;
color:#00ffff;
text-shadow:0 0 10px cyan,
0 0 20px cyan,
0 0 40px cyan;

}

.header h2{

margin-top:10px;
color:#00ff88;

}

.line{

margin:10px 0;
font-size:20px;

}

.cursor{

display:inline-block;
width:10px;
background:#00ff88;
animation:blink .8s infinite;

}

@keyframes blink{

50%{
opacity:0;
}

}

.start{

margin-top:30px;
text-align:center;

}

button{

padding:15px 45px;
font-size:18px;
background:#00ff88;
border:none;
border-radius:8px;
cursor:pointer;
font-weight:bold;
transition:.3s;

}

button:hover{

background:#00ffff;
transform:scale(1.08);
box-shadow:0 0 20px cyan;

}

.footer{

margin-top:30px;
text-align:center;
color:#999;

}

</style>

</head>
